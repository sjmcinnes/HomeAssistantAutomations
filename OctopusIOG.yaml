alias: Octopus IOG off peak tariff use via Ohme charging and set cheap window
description: >
  Starts the Wave Spa heater and Immersion heater, and raises Sunsynk battery
  capacity to 100% (charge) during cheap electricity periods or Ohme extra charging
  slots. Stops the heaters and returns Sunsynk battery capacity to 10% (discharge) when
  those periods end.
triggers:
  - trigger: numeric_state
    entity_id: sensor.ohme_epod_power
    above: 1
    for: "00:01:00"
    id: ohme_started_outside_cheap_window
  - trigger: numeric_state
    entity_id: sensor.ohme_epod_power
    below: 1
    for: "00:01:00"
    id: ohme_stopped_outside_cheap_window
  - trigger: time
    at: "23:30:00"
    id: cheap_window_started
  - trigger: time
    at: "05:30:00"
    id: cheap_window_stopped
conditions: []
actions:
  - variables:
      in_cheap_window: |
        {{ now().strftime('%H:%M') >= '23:30'
           or now().strftime('%H:%M') < '05:30' }}
      outside_cheap_window: |
        {{ not in_cheap_window }}
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{ trigger.id == 'cheap_window_started'
                 or (
                   trigger.id == 'ohme_started_outside_cheap_window'
                   and outside_cheap_window
                 ) }}
        sequence:
          - target:
              entity_id: climate.wave_spa_eu_spa_thermostat
            data:
              temperature: 40
            action: climate.set_temperature
          - target:
              entity_id:
                - switch.wave_spa_eu_heater
                - switch.immersion_heater_switch_1
            action: switch.turn_on
          - target:
              entity_id: number.2205186946_time_slot_1_capacity
            data:
              value: 100
            action: number.set_value
          - data:
              name: Spa, immersion and Sunsynk
              message: >
                Wave Spa heater and immersion heater started. Sunsynk battery
                capacity set to 100%. Trigger: {{ trigger.id }}.
              entity_id: switch.immersion_heater_switch_1
              domain: automation
            action: logbook.log
      - conditions:
          - condition: template
            value_template: |
              {{ trigger.id == 'cheap_window_stopped'
                 or (
                   trigger.id == 'ohme_stopped_outside_cheap_window'
                   and outside_cheap_window
                 ) }}
        sequence:
          - target:
              entity_id:
                - switch.wave_spa_eu_heater
                - switch.immersion_heater_switch_1
            action: switch.turn_off
          - target:
              entity_id: number.2205186946_time_slot_1_capacity
            data:
              value: 10
            action: number.set_value
          - data:
              name: Spa, immersion and Sunsynk
              message: >
                Wave Spa heater and immersion heater stopped. Sunsynk battery
                capacity set to 10%. Trigger: {{ trigger.id }}.
              entity_id: switch.immersion_heater_switch_1
              domain: automation
            action: logbook.log
mode: single
