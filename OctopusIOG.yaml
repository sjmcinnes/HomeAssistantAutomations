alias: Octopus IOG off peak tariff use via Ohme charging and set cheap window
description: >
  Starts the Wave Spa heater and immersion heater, and raises Sunsynk battery
  capacity to 100% during cheap electricity periods or Ohme extra charging
  slots. Stops the heaters and returns Sunsynk battery capacity to 10% when
  those periods end.
triggers:
  - trigger: numeric_state
    entity_id: sensor.ohme_epod_power
    above: 1
    for: "00:01:00"
    id: ohme_started_outside_cheap_window
  - trigger: numeric_state
    entity_id: sensor.ohme_epod_power
    below: 1
    for: "00:01:00"
    id: ohme_stopped_outside_cheap_window
  - trigger: time
    at: "23:30:00"
    id: cheap_window_started
  - trigger: time
    at: "05:30:00"
    id: cheap_window_stopped
conditions: []
actions:
  - variables:
      in_cheap_window: |
        {{ now().strftime('%H:%M') >= '23:30'
           or now().strftime('%H:%M') < '05:30' }}
      outside_cheap_window: "{{ not in_cheap_window }}"
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{
                (trigger.id == 'cheap_window_started' and in_cheap_window)
                or
                (trigger.id == 'ohme_started_outside_cheap_window'
                 and outside_cheap_window)
              }}
        sequence:
          - action: logbook.log
            data:
              name: Spa, immersion and Sunsynk
              message: |
                Start sequence began. Trigger: {{ trigger.id }}.
              entity_id: switch.immersion_heater_switch_1
              domain: automation
          - parallel:
              - action: climate.set_temperature
                target:
                  entity_id: climate.wave_spa_eu_spa_thermostat
                data:
                  temperature: 40
              - action: switch.turn_on
                target:
                  entity_id: switch.wave_spa_eu_filter
              - action: number.set_value
                target:
                  entity_id: number.2205186946_time_slot_1_capacity
                data:
                  value: 100
              - sequence:
                  - repeat:
                      sequence:
                        - action: switch.turn_on
                          target:
                            entity_id: switch.immersion_heater_switch_1
                          continue_on_error: true
                        - wait_template: >
                            {{ is_state('switch.immersion_heater_switch_1',
                            'on') }}
                          timeout: "00:00:10"
                          continue_on_timeout: true
                      until:
                        - condition: template
                          value_template: >
                            {{ is_state('switch.immersion_heater_switch_1',
                            'on')
                               or repeat.index >= 3 }}
                  - condition: state
                    entity_id: switch.immersion_heater_switch_1
                    state: "on"
          - action: logbook.log
            data:
              name: Spa, immersion and Sunsynk
              message: |
                Start sequence completed. Trigger: {{ trigger.id }}.
              entity_id: switch.immersion_heater_switch_1
              domain: automation
      - conditions:
          - condition: template
            value_template: |
              {{
                (trigger.id == 'cheap_window_stopped' and outside_cheap_window)
                or
                (trigger.id == 'ohme_stopped_outside_cheap_window'
                 and outside_cheap_window)
              }}
        sequence:
          - action: logbook.log
            data:
              name: Spa, immersion and Sunsynk
              message: |
                End sequence began. Trigger: {{ trigger.id }}.
              entity_id: switch.immersion_heater_switch_1
              domain: automation
          - parallel:
              - action: switch.turn_off
                target:
                  entity_id: switch.wave_spa_eu_heater
              - action: switch.turn_on
                target:
                  entity_id: switch.wave_spa_eu_filter
              - action: number.set_value
                target:
                  entity_id: number.2205186946_time_slot_1_capacity
                data:
                  value: 10
              - sequence:
                  - repeat:
                      sequence:
                        - action: switch.turn_off
                          target:
                            entity_id: switch.immersion_heater_switch_1
                          continue_on_error: true
                        - wait_template: >
                            {{ is_state('switch.immersion_heater_switch_1',
                            'off') }}
                          timeout: "00:00:10"
                          continue_on_timeout: true
                      until:
                        - condition: template
                          value_template: >
                            {{ is_state('switch.immersion_heater_switch_1',
                            'off')
                               or repeat.index >= 3 }}
                  - condition: state
                    entity_id: switch.immersion_heater_switch_1
                    state: "off"
          - action: logbook.log
            data:
              name: Spa, immersion and Sunsynk
              message: |
                End sequence completed. Trigger: {{ trigger.id }}.
              entity_id: switch.immersion_heater_switch_1
              domain: automation
trace:
  stored_traces: 100
mode: queued
max: 10
max_exceeded: silent
